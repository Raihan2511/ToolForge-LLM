# configs/qwen7b_unsloth.yaml
# Qwen2.5-7B-Instruct — LoRA via Unsloth
# Hardware : NVIDIA L40S 48GB
# VRAM est.: ~22–26 GB (4-bit base + bf16 adapters + activations)

model:
  name: "unsloth/Qwen2.5-7B-Instruct"
  max_seq_length: 4096
  # CRITICAL: This value MUST be identical between training and inference.
  # Unsloth pre-computes RoPE frequency tables at load time based on this.
  # Mismatch → for_inference() crashes with a RoPE positional index error.
  # 4096 gives headroom for system prompt (~800 tok) + tool schema + long queries.
  load_in_4bit: true
  dtype: "bfloat16"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42

data:
  train_file: "/workspace/training/data/train.jsonl"
  val_file:   "/workspace/training/data/val.jsonl"

training:
  output_dir: "/workspace/training/runs/qwen7b_unsloth"

  num_epochs: 1
  # The 1-epoch run was a diagnostic. Training resumes from checkpoint-1000
  # and runs to full completion.
  # HuggingFace Trainer reads the checkpoint state and counts remaining steps
  # correctly — it will NOT restart from epoch 0.

  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8   # Effective batch = 4 × 8 = 32

  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: "adamw_8bit"

  bf16: true
  fp16: false

  logging_steps: 20
  eval_strategy: "steps"
  eval_steps: 200
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3

  # FIX: early stopping REMOVED.
  # With num_epochs=3 and eval every 500 steps you have ~17 evals total.
  # EarlyStoppingCallback(patience=3) was firing after only 3 evals
  # (~35% into epoch 1) because the loss plateau during warm-up looked like
  # convergence. At epoch 0.35 the model is still learning — early stopping
  # here is meaningless and just kills the run prematurely.
  # Monitor eval_loss manually via TensorBoard instead.
  # If loss genuinely stops falling after epoch 1, stop manually.

  seed: 42
  report_to: "tensorboard"
